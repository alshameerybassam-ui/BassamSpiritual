<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعادة كلمة المرور</title><link rel="stylesheet" href="/v2.css"><style>main{max-width:520px;margin:9vh auto;padding:18px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}label{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:700}input{padding:12px;border:1px solid var(--line);border-radius:12px}</style></head><body><main><div class="box"><h1>إعادة تعيين كلمة المرور</h1><label>كلمة المرور الجديدة<input id="password" type="password" minlength="8"></label><button class="btn primary" onclick="reset()">حفظ كلمة المرور</button><div id="msg"></div></div></main><script>
async function reset(){const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/v2/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password.value})});const d=await r.json();msg.textContent=d.message||d.error;if(r.ok)setTimeout(()=>location.href='/login-v2.html',1200)}
</script></body></html>
