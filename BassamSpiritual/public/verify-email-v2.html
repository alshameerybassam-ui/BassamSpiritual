<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد البريد</title><link rel="stylesheet" href="/v2.css"><style>main{max-width:520px;margin:12vh auto;padding:18px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}</style></head><body><main><div class="box"><h1>تأكيد البريد الإلكتروني</h1><p id="msg">جاري التحقق…</p><a class="btn" href="/login-v2.html">تسجيل الدخول</a></div></main><script>
(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token){msg.textContent='رابط غير صالح.';return}const r=await fetch('/api/v2/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();msg.textContent=d.message||d.error})()
</script></body></html>
