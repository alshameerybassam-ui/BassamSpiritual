<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول | النور الرباني</title><link rel="stylesheet" href="/v2.css"><style>main{max-width:520px;margin:9vh auto;padding:18px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 50px rgba(15,23,42,.08)}label{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:700}input{padding:12px;border:1px solid var(--line);border-radius:12px}.btn{margin-top:10px}</style></head><body><main><div class="box"><span class="eyebrow">مركز النور الرباني</span><h1>تسجيل الدخول</h1><label>البريد<input id="email" type="email" autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><button class="btn primary" style="width:100%" onclick="login()">دخول</button><button class="btn" style="width:100%" onclick="forgot()">نسيت كلمة المرور</button><a href="/register-v2.html">إنشاء حساب جديد</a><div id="msg" style="margin-top:14px"></div></div></main><script>
async function login(){const r=await fetch('/api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();msg.textContent=d.error||'';if(r.ok){localStorage.setItem('bassam_auth_token',d.token);localStorage.setItem('bassam_user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'/admin-v2.html':'/dashboard.html'}}
async function forgot(){const e=prompt('أدخل بريدك الإلكتروني');if(!e)return;const r=await fetch('/api/v2/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e})});const d=await r.json();alert(d.message||d.error||(d.resetUrl||''));}
</script></body></html>
