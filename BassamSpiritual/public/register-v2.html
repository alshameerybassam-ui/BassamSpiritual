<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل | النور الرباني</title><link rel="stylesheet" href="/v2.css"><style>main{max-width:560px;margin:6vh auto;padding:18px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 50px rgba(15,23,42,.08)}label{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:700}input{padding:12px;border:1px solid var(--line);border-radius:12px}.btn{margin-top:10px;width:100%}</style></head><body><main><div class="box"><span class="eyebrow">مركز النور الرباني</span><h1>إنشاء حساب</h1><label>الاسم<input id="name" autocomplete="name"></label><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email"></label><label>رقم الهاتف<input id="phone" autocomplete="tel"></label><label>كلمة المرور<input id="password" type="password" autocomplete="new-password"></label><button class="btn primary" onclick="register()">إنشاء الحساب</button><div id="msg" style="margin-top:14px"></div><a href="/login-v2.html">لدي حساب بالفعل</a></div></main><script>
async function register(){const r=await fetch('/api/v2/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:name.value,email:email.value,phone:phone.value,password:password.value})});const d=await r.json();msg.textContent=d.error||'تم إنشاء الحساب. '+(d.requiresVerification?'يرجى مراجعة بريدك الإلكتروني.': 'يمكنك تسجيل الدخول الآن.');if(d.verifyUrl)msg.innerHTML+=' <br><a target="_blank" href="'+d.verifyUrl+'">فتح رابط التحقق التجريبي</a>'}
</script></body></html>
