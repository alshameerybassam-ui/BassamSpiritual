<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجلسات الأسبوعية | النور الرباني</title><link rel="stylesheet" href="/v2.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"></head>
<body>
<div class="topbar"><div><span class="eyebrow">مركز النور الرباني</span><h1>الجلسات الأسبوعية</h1><p>اختر الموضوع الذي ترغب أن نناقشه هذا الأسبوع</p></div><a href="/" class="btn ghost">الرئيسية</a></div>
<main class="content-v2"><div id="sessions"></div></main>
<script>
const key='nour_session_visitor';if(!localStorage.getItem(key))localStorage.setItem(key,crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
async function load(){const r=await fetch('/api/v2/sessions');const d=await r.json();document.getElementById('sessions').innerHTML=(d.sessions||[]).map(s=>`<article class="card-v2"><div class="section-head"><div><span class="eyebrow">${s.mode==='live'?'مباشرة':s.mode==='recorded'?'مسجلة':'مباشرة ثم مسجلة'}</span><h2>${esc(s.title)}</h2><p class="muted">${new Date(s.startsAt).toLocaleString('ar')}</p></div><div>${s.recordingUrl?`<a class="btn" target="_blank" href="${escAttr(s.recordingUrl)}">مشاهدة التسجيل</a>`:''}${s.liveUrl?`<a class="btn primary" target="_blank" href="${escAttr(s.liveUrl)}">صفحة الجلسة</a>`:''}</div></div><p>${esc(s.description||'')}</p><div><b>صوّت للموضوع:</b>${(s.topics||[]).map(t=>`<div class="topic"><span>${esc(t.title)} <small>(${t.voteCount})</small></span><button class="btn" onclick="vote(${s.id},${t.id})">تصويت</button></div>`).join('')}</div></article>`).join('')||'<div class="card-v2">لا توجد جلسات معلنة حالياً.</div>'}
async function vote(sessionId,topicId){const r=await fetch('/api/v2/sessions/'+sessionId+'/vote',{method:'POST',headers:{'Content-Type':'application/json','X-Visitor-Key':localStorage.getItem(key)},body:JSON.stringify({topicId})});const d=await r.json();alert(d.error||'تم تسجيل التصويت');if(r.ok)load()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function escAttr(s){return esc(s)}
load();
</script></body></html>
